<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Learning The Four Seasons - Accessible Educational App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@600;700;800&display=swap');
        
        * {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Fredoka', 'Open Sans', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* Large touch target focus styles */
        .btn-touch {
            min-height: 72px;
            min-width: 72px;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
        }

        .btn-touch:active {
            transform: scale(0.96);
        }

        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        .card-shadow-lg {
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.12), 0 10px 15px -5px rgba(0, 0, 0, 0.06);
        }

        /* Pulse animation for active target highlight */
        @keyframes gentle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .gentle-pulse {
            animation: gentle-pulse 2.5s infinite ease-in-out;
        }

        /* Wobble animation for try again feedback */
        @keyframes gentle-wobble {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .gentle-wobble {
            animation: gentle-wobble 0.4s ease-in-out;
        }

        /* Star Float Animation */
        @keyframes float-up {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
        }

        .star-particle {
            position: absolute;
            animation: float-up 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
        }

        /* Focus rings for keyboard and accessibility */
        button:focus-visible, div[tabindex="0"]:focus-visible {
            outline: 4px solid #3b82f6;
            outline-offset: 4px;
        }
    
        /* ===== SEASON WEATHER (E2.4) - self-contained styles, no Tailwind needed ===== */
        .sw{width:100%;max-width:960px;margin:0 auto;text-align:center;font-family:inherit}
        .sw-card{background:#fff;border:4px solid #334155;border-radius:28px;padding:16px;margin-bottom:16px;position:relative}
        .sw-top{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;cursor:pointer}
        .sw-big{font-size:clamp(72px,16vw,140px);line-height:1.1;display:block}
        .sw-lbl{font-size:clamp(24px,5vw,40px);font-weight:800;color:#0f172a;display:block}
        .sw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:16px}
        .sw-btn{min-height:160px;background:#fff;border:6px solid #475569;border-radius:28px;padding:10px;cursor:pointer;font-family:inherit;font-size:20px;font-weight:700;color:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
        .sw-btn:active{transform:scale(.97)}
        .sw-btn.ok{border-color:#15803d;background:#dcfce7!important}
        .sw-btn.ok::after{content:'✓';font-size:40px;color:#15803d;font-weight:800}
        .sw-btn:focus-visible,.sw-go:focus-visible{outline:5px solid #1d4ed8;outline-offset:3px}
        .sw-go{font-family:inherit;font-size:30px;font-weight:800;padding:16px 40px;border-radius:24px;background:#1d4ed8;color:#fff;border:0;min-height:76px;margin:8px;cursor:pointer}
        .sw-say{position:absolute;top:10px;right:10px;font-size:34px;width:76px;height:76px;border-radius:22px;border:4px solid #1d4ed8;background:#dbeafe;cursor:pointer}
        .sw-bar{height:20px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:10px}
        .sw-bar i{display:block;height:100%;background:#16a34a;transition:width .4s}
        .sw-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:18px;font-weight:700;text-align:left}
        [data-drag],[id^="sorting-item-"]{touch-action:none;cursor:grab}
        @media (prefers-reduced-motion:reduce){.sw-bar i,.sw-btn{transition:none}}
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-between selection:bg-none">

    <!-- TOP NAVIGATION & PROFILE BAR -->
    <header class="bg-white border-b-4 border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
            
            <!-- Left: Home / Back Button -->
            <button id="btn-home" onclick="goToHome()" class="btn-touch flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold px-4 py-2 rounded-2xl border-2 border-slate-300 text-lg md:text-xl">
                <span class="text-2xl">🏠</span>
                <span class="hidden sm:inline">HOME</span>
            </button>

            <!-- Center: Active Profile Display -->
            <div class="flex items-center gap-2 bg-amber-50 border-2 border-amber-300 px-4 py-2 rounded-2xl">
                <button onclick="toggleStudentProfile()" class="flex items-center gap-2 focus:outline-none" title="Switch Student Profile">
                    <span id="profile-avatar" class="text-3xl md:text-4xl">🦊</span>
                    <div class="text-left">
                        <div class="text-xs text-amber-700 font-bold uppercase tracking-wider">Student</div>
                        <div id="profile-name" class="text-lg md:text-xl font-bold text-amber-900 leading-tight">Student 1</div>
                    </div>
                </button>
                <div class="h-8 w-px bg-amber-300 mx-1"></div>
                <!-- Stars Counter -->
                <div class="flex items-center gap-1 bg-amber-200 px-3 py-1 rounded-xl">
                    <span class="text-2xl">⭐</span>
                    <span id="stars-count" class="text-xl font-bold text-amber-950">0</span>
                </div>
            </div>

            <!-- Right: Sound Toggle & Teacher Access -->
            <div class="flex items-center gap-2">
                <button id="btn-audio-toggle" onclick="toggleAudio()" class="btn-touch bg-blue-50 hover:bg-blue-100 text-blue-700 p-3 rounded-2xl border-2 border-blue-200 text-2xl flex items-center justify-center" aria-label="Toggle Sound">
                    🔊
                </button>
                <button onclick="openTeacherModal()" class="btn-touch bg-purple-50 hover:bg-purple-100 text-purple-700 p-3 rounded-2xl border-2 border-purple-200 text-2xl flex items-center justify-center" aria-label="Teacher Dashboard">
                    ⚙️
                </button>
            </div>

        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="app-viewport" class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center items-center">
        <!-- Dynamic content injected here via JS -->
    </main>

    <!-- CELEBRATION OVERLAY (Calm floating stars) -->
    <div id="celebration-overlay" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center hidden">
        <div id="star-container" class="relative w-64 h-64 flex items-center justify-center">
            <!-- Dynamic stars injected here -->
        </div>
    </div>

    <!-- TEACHER DASHBOARD MODAL -->
    <div id="teacher-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl border-4 border-purple-300 max-w-2xl w-full p-6 md:p-8 card-shadow-lg max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between border-b-2 border-slate-100 pb-4 mb-6">
                <div class="flex items-center gap-3">
                    <span class="text-4xl">⚙️</span>
                    <div>
                        <h2 class="text-2xl font-bold text-slate-800">Teacher Dashboard</h2>
                        <p class="text-slate-500 text-sm">Settings, progress & level selection</p>
                    </div>
                </div>
                <button onclick="closeTeacherModal()" class="text-slate-400 hover:text-slate-600 text-3xl font-bold p-2">✕</button>
            </div>

            <!-- Student Profile Settings -->
            <div class="space-y-6">
                <div class="bg-purple-50 p-4 rounded-2xl border-2 border-purple-100">
                    <h3 class="font-bold text-purple-900 text-lg mb-3">Student Profiles</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- Student 1 Edit -->
                        <div class="bg-white p-3 rounded-xl border border-purple-200 space-y-2">
                            <label class="block text-xs font-bold text-slate-500 uppercase">Student 1 Name</label>
                            <input type="text" id="teacher-s1-name" value="Student 1" onchange="updateStudentName('student1', this.value)" class="w-full px-3 py-2 border-2 border-slate-200 rounded-lg text-lg font-bold text-slate-800">
                            <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
                                <span>Avatar:</span>
                                <div class="flex gap-1">
                                    <button onclick="updateStudentAvatar('student1', '🦊')" class="p-1 hover:bg-slate-100 rounded">🦊</button>
                                    <button onclick="updateStudentAvatar('student1', '🦁')" class="p-1 hover:bg-slate-100 rounded">🦁</button>
                                    <button onclick="updateStudentAvatar('student1', '🐸')" class="p-1 hover:bg-slate-100 rounded">🐸</button>
                                </div>
                            </div>
                        </div>
                        <!-- Student 2 Edit -->
                        <div class="bg-white p-3 rounded-xl border border-purple-200 space-y-2">
                            <label class="block text-xs font-bold text-slate-500 uppercase">Student 2 Name</label>
                            <input type="text" id="teacher-s2-name" value="Student 2" onchange="updateStudentName('student2', this.value)" class="w-full px-3 py-2 border-2 border-slate-200 rounded-lg text-lg font-bold text-slate-800">
                            <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
                                <span>Avatar:</span>
                                <div class="flex gap-1">
                                    <button onclick="updateStudentAvatar('student2', '🐼')" class="p-1 hover:bg-slate-100 rounded">🐼</button>
                                    <button onclick="updateStudentAvatar('student2', '🐨')" class="p-1 hover:bg-slate-100 rounded">🐨</button>
                                    <button onclick="updateStudentAvatar('student2', '🦄')" class="p-1 hover:bg-slate-100 rounded">🦄</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Difficulty & Sound Toggles -->
                <div class="bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 space-y-4">
                    <h3 class="font-bold text-slate-800 text-lg">App Options</h3>
                    
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <div class="font-bold text-slate-700">Speech Audio</div>
                            <div class="text-xs text-slate-500">Read words & feedback aloud</div>
                        </div>
                        <button id="teacher-toggle-speech" onclick="toggleSpeechSetting()" class="px-4 py-2 bg-emerald-500 text-white font-bold rounded-xl text-sm">ENABLED</button>
                    </div>

                    <hr class="border-slate-200">

                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <div class="font-bold text-slate-700">Calm Star Celebrations</div>
                            <div class="text-xs text-slate-500">Visual star particles on match</div>
                        </div>
                        <button id="teacher-toggle-celeb" onclick="toggleCelebrationSetting()" class="px-4 py-2 bg-emerald-500 text-white font-bold rounded-xl text-sm">ENABLED</button>
                    </div>
                </div>

                <!-- Jump to Level directly -->
                <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200">
                    <h3 class="font-bold text-amber-900 text-lg mb-2">Direct Level Jump</h3>
                    <p class="text-amber-700 text-xs mb-3">Choose any level for the active student:</p>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                        <button onclick="jumpToLevel(1)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L1: Same Picture</button>
                        <button onclick="jumpToLevel(2)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L2: 3 Pictures</button>
                        <button onclick="jumpToLevel(3)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L3: Season Match</button>
                        <button onclick="jumpToLevel(4)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L4: Picture→Word</button>
                        <button onclick="jumpToLevel(5)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L5: Word→Picture</button>
                        <button onclick="jumpToLevel(6)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L6: Word→Word</button>
                        <button onclick="jumpToLevel(7)" class="p-2 bg-white border-2 border-amber-300 rounded-xl font-bold text-amber-900 text-sm hover:bg-amber-100">L7: Season Sorting</button>
                    </div>
                </div>

                <!-- Season Weather progress (E2.4) -->
                <div class="pt-2"><button onclick="swTeacher()" class="w-full px-4 py-3 bg-sky-100 hover:bg-sky-200 text-sky-900 font-bold rounded-xl border border-sky-300 text-sm">🌦️ Season Weather (E2.4) – Progress &amp; Teacher Info</button></div>

                <!-- Reset Student Progress -->
                <div class="pt-2 flex justify-between items-center">
                    <button onclick="resetCurrentStudentProgress()" class="px-4 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-xl border border-rose-300 text-sm">
                        Reset Student Progress
                    </button>
                    <button onclick="closeTeacherModal()" class="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-2xl text-lg">
                        Done
                    </button>
                </div>
            </div>

        </div>
    </div>

        // Web Audio API Context for Chimes
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        /**
         * Text-to-Speech Engine using window.speechSynthesis
         */
        function speakText(text) {
            if (!appState.settings.speechEnabled) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop ongoing speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.85; // Slightly slower, clear speed for young learners
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        /**
         * Web Audio Synthesizer for Chimes & Tones
         */
        function playSound(type) {
            if (!appState.settings.soundEffects) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                if (type === 'correct') {
                    // Ascending major chime (C5 -> E5 -> G5)
                    const notes = [523.25, 659.25, 783.99];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        
                        gain.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.35);
                        
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        osc.start(ctx.currentTime + idx * 0.1);
                        osc.stop(ctx.currentTime + idx * 0.1 + 0.4);
                    });
                } else if (type === 'try_again') {
                    // Soft low mellow boop tone (non-punitive)
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(260, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.2);
                    
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {
                console.log('Audio Context playback error:', e);
            }
        }

            const arr = [...array];

                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function generateQuestion() {
            const season = SEASONS_DATA[appState.activeSeasonId] || SEASONS_DATA.fall;
            const targetItem = getRandomItem(season.items);
            const allItems = getAllItems();

            let question = {
                level: appState.activeLevelNum,
                seasonId: season.id,
                targetItem: targetItem,
                choices: []
            };

            if (appState.activeLevelNum === 1) {
                // LEVEL 1: Picture -> Same Picture (2 choices)
                const distractor = getRandomItem(allItems.filter(i => i.id !== targetItem.id));
                question.choices = shuffleArray([
                    { ...targetItem, isCorrect: true },
                    { ...distractor, isCorrect: false }
                ]);
            } 
            else if (appState.activeLevelNum === 2) {
                // LEVEL 2: Picture -> Picture (3 choices)
                const distractors = shuffleArray(allItems.filter(i => i.id !== targetItem.id)).slice(0, 2);
                question.choices = shuffleArray([
                    { ...targetItem, isCorrect: true },
                    ...distractors.map(d => ({ ...d, isCorrect: false }))
                ]);
            }
            else if (appState.activeLevelNum === 3) {
                // LEVEL 3: Picture -> Seasonal Picture
                // Target is an item. Choice 1 is ANOTHER item from same season. Choices 2 & 3 are from different seasons.
                const sameSeasonOtherItem = getRandomItem(season.items.filter(i => i.id !== targetItem.id)) || targetItem;
                const otherSeasonItems = shuffleArray(allItems.filter(i => i.seasonId !== season.id)).slice(0, 2);
                
                question.choices = shuffleArray([
                    { ...sameSeasonOtherItem, isCorrect: true },
                    ...otherSeasonItems.map(d => ({ ...d, isCorrect: false }))
                ]);
            }
            else if (appState.activeLevelNum === 4) {
                // LEVEL 4: Picture -> Word (3 word choices)
                const distractors = shuffleArray(allItems.filter(i => i.id !== targetItem.id)).slice(0, 2);
                question.choices = shuffleArray([
                    { ...targetItem, isCorrect: true },
                    ...distractors.map(d => ({ ...d, isCorrect: false }))
                ]);
            }
            else if (appState.activeLevelNum === 5) {
                // LEVEL 5: Word -> Picture (3 picture choices)
                const distractors = shuffleArray(allItems.filter(i => i.id !== targetItem.id)).slice(0, 2);
                question.choices = shuffleArray([
                    { ...targetItem, isCorrect: true },
                    ...distractors.map(d => ({ ...d, isCorrect: false }))
                ]);
            }
            else if (appState.activeLevelNum === 6) {
                // LEVEL 6: Word -> Word (3 word choices)
                const distractors = shuffleArray(allItems.filter(i => i.id !== targetItem.id)).slice(0, 2);
                question.choices = shuffleArray([
                    { ...targetItem, isCorrect: true },
                    ...distractors.map(d => ({ ...d, isCorrect: false }))
                ]);
            }
            else if (appState.activeLevelNum === 7) {
                // LEVEL 7: Season Sorting
                // Target Season Bin. 4 Items (2 belong to season, 2 belong to other seasons)
                const seasonItems = shuffleArray(season.items).slice(0, 2);

 return`<h3 style="font-size:22px;font-weight:800;margin-top:12px">${s.avatar} ${s.name} – ${c}/${SWL.length}</h3><div class="sw-bar"><i style="width:${100*c/SWL.length}%"></i></div>`+SWL.map((l,i)=>`<div class="sw-row"><span>${l.k}</span><span>${d[i]?'✅':'⬜'}</span></div>`).join('')}).join('')}
 <div style="margin-top:12px"><button class="sw-go" style="font-size:18px;min-height:56px;padding:8px 20px" onclick="st_unlock()">Unlock all levels (current student)</button>
 <button class="sw-go" style="font-size:18px;min-height:56px;padding:8px 20px;background:#be123c" onclick="st_reset()">Reset Season Weather (current student)</button>
 <button class="sw-go" style="font-size:18px;min-height:56px;padding:8px 20px;background:#475569" onclick="goToHome()">Back</button></div>
 <p style="font-size:13px;color:#64748b;margin-top:14px">Ontario Grade 1 Science – E2.4<br>“Describe and compare the four seasons in terms of weather, including precipitation and temperature.”</p></div></div>`};
window.st_unlock=()=>{st().all=true;saveStateToStorage();swTeacher()};
window.st_reset=()=>{if(confirm('Reset Season Weather progress for this student?')){appState.students[appState.currentStudent].sw={done:{},v:2};saveStateToStorage();swTeacher()}};
const _rh=renderHomeScreen;
renderHomeScreen=function(){_rh();const c=document.querySelector('#app-viewport>div');if(!c)return;
 c.insertAdjacentHTML('beforeend',`<button class="sw-btn" style="width:100%;max-width:896px;margin:24px auto 0;flex-direction:row;gap:20px;border-color:#0369a1;background:#e0f2fe" onclick="speakText('Season Weather');swMenu()" aria-label="Season Weather"><span class="sw-big" style="font-size:72px">🌦️</span><span class="sw-lbl">SEASON WEATHER</span><span class="sw-lbl">${pct()}%</span></button>`)};
window.__SWL=SWL;
})();
</script>
<script>
/* ===== Drag & drop (mouse, touch, pen) for both sorting levels. Tapping still works. ===== */
(function(){
let d=null,last=0;
const zones=()=>document.querySelectorAll('#season-bin,[data-drop]');
document.addEventListener('pointerdown',e=>{const el=e.target.closest&&e.target.closest('[data-drag],[id^="sorting-item-"]');
 if(!el||(e.pointerType==='mouse'&&e.button))return;d={el,x:e.clientX,y:e.clientY,on:0}});
document.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;
 if(!d.on){if(Math.hypot(dx,dy)<10)return;d.on=1;Object.assign(d.el.style,{zIndex:60,pointerEvents:'none',opacity:'.9',position:'relative'})}
 d.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.08)';
 const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest('#season-bin,[data-drop]');
 zones().forEach(b=>b.style.outline=b===z?'8px solid #1d4ed8':'');e.preventDefault()},{passive:false});
function end(e,cancel){if(!d)return;const o=d;d=null;if(!o.on)return;
 const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest('#season-bin,[data-drop]'),el=o.el;
 Object.assign(el.style,{zIndex:'',pointerEvents:'',opacity:'',transform:''});zones().forEach(b=>b.style.outline='');last=Date.now();
 if(!z||cancel)return; // dropped elsewhere: item just slides back, nothing else happens
 if(el.dataset.drag)swTap(el.dataset.drag);
 else{appState.selectedSortingItem=+el.id.split('-')[2];handleBinTap()}}
document.addEventListener('pointerup',e=>end(e));
document.addEventListener('pointercancel',e=>end(e,1));
document.addEventListener('click',e=>{if(Date.now()-last<400){e.stopPropagation();e.preventDefault()}},true);
})();
</script>
</body>
</html>
